<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sportsbook Academy - Wallet API Testing</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 14px 28px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .result.success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }

        .result.error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }

        .result.info {
            background: #d1ecf1;
            border: 1px solid #bee5eb;
            color: #0c5460;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            margin-left: 10px;
        }

        .status-badge.online {
            background: #d4edda;
            color: #155724;
        }

        .status-badge.offline {
            background: #f8d7da;
            color: #721c24;
        }

        .link-button {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 16px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
            transition: background 0.3s;
        }

        .link-button:hover {
            background: #5568d3;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎓 Sportsbook Academy</h1>
            <p>Wallet API Integration Testing Interface</p>
            <div id="status"></div>
        </div>

        <!-- Complete Flow -->
        <div class="card">
            <h2>🚀 Complete Login Flow</h2>
            <p style="color: #666; margin-bottom: 20px;">This simulates the full LearnWorlds → Sportsbook flow</p>

            <form id="completeFlowForm">
                <div class="grid">
                    <div class="form-group">
                        <label>Username *</label>
                        <input type="text" id="flow_username" placeholder="e.g., john_doe_123" required>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="flow_email" placeholder="user@example.com">
                    </div>
                </div>

                <div class="grid">
                    <div class="form-group">
                        <label>First Name</label>
                        <input type="text" id="flow_firstName" placeholder="John">
                    </div>
                    <div class="form-group">
                        <label>Last Name</label>
                        <input type="text" id="flow_lastName" placeholder="Doe">
                    </div>
                </div>

                <div class="grid">
                    <div class="form-group">
                        <label>Currency</label>
                        <select id="flow_currency">
                            <option value="USD">USD - US Dollar</option>
                            <option value="EUR">EUR - Euro</option>
                            <option value="GBP">GBP - British Pound</option>
                            <option value="BRL">BRL - Brazilian Real</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Initial Balance (for new users)</label>
                        <input type="number" id="flow_balance" value="100" step="0.01" min="0">
                    </div>
                </div>

                <button type="submit" class="btn" id="flowBtn">
                    Login to Sportsbook
                </button>
            </form>

            <div id="flowResult"></div>
        </div>

        <!-- Individual Tests -->
        <div class="card">
            <h2>🔧 Individual API Tests</h2>

            <!-- Check User -->
            <div style="margin-bottom: 30px;">
                <h3 style="color: #333; margin-bottom: 15px;">Check if User Exists</h3>
                <form id="checkUserForm">
                    <div class="form-group">
                        <label>Username</label>
                        <input type="text" id="check_username" placeholder="Enter username" required>
                    </div>
                    <button type="submit" class="btn" id="checkBtn">Check User</button>
                </form>
                <div id="checkResult"></div>
            </div>

            <!-- Create User -->
            <div style="margin-bottom: 30px;">
                <h3 style="color: #333; margin-bottom: 15px;">Create New User</h3>
                <form id="createUserForm">
                    <div class="grid">
                        <div class="form-group">
                            <label>Username *</label>
                            <input type="text" id="create_username" placeholder="unique_username" required>
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" id="create_email" placeholder="user@example.com">
                        </div>
                    </div>
                    <button type="submit" class="btn" id="createBtn">Create User</button>
                </form>
                <div id="createResult"></div>
            </div>

            <!-- Generate Token -->
            <div>
                <h3 style="color: #333; margin-bottom: 15px;">Generate Login Token</h3>
                <form id="tokenForm">
                    <div class="form-group">
                        <label>Customer ID</label>
                        <input type="text" id="token_customerId" placeholder="Enter customer ID" required>
                    </div>
                    <button type="submit" class="btn" id="tokenBtn">Generate Token</button>
                </form>
                <div id="tokenResult"></div>
            </div>
        </div>
    </div>

    <script>
        // Check API status on load
        async function checkStatus() {
            try {
                const response = await fetch('/api/health');
                const data = await response.json();
                document.getElementById('status').innerHTML = `
                    <span class="status-badge online">✓ API Online</span>
                    <p style="margin-top: 10px; font-size: 14px;">Connected to: ${data.walletApiUrl}</p>
                `;
            } catch (error) {
                document.getElementById('status').innerHTML = `
                    <span class="status-badge offline">✗ API Offline</span>
                `;
            }
        }

        checkStatus();

        // Helper function to display results
        function showResult(elementId, data, type = 'success') {
            const element = document.getElementById(elementId);
            element.className = `result ${type}`;
            element.textContent = JSON.stringify(data, null, 2);
        }

        // Complete Flow
        document.getElementById('completeFlowForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('flowBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Processing...';

            try {
                const response = await fetch('/api/sportsbook-login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('flow_username').value,
                        email: document.getElementById('flow_email').value,
                        firstName: document.getElementById('flow_firstName').value,
                        lastName: document.getElementById('flow_lastName').value,
                        currency: document.getElementById('flow_currency').value,
                        initialBalance: document.getElementById('flow_balance').value
                    })
                });

                const data = await response.json();

                if (data.success) {
                    document.getElementById('flowResult').innerHTML = `
                        <div class="result success">
                            <strong>✓ Success!</strong><br><br>
                            ${data.isNewUser ? '🆕 New user created' : '👤 Existing user found'}<br>
                            Customer ID: ${data.customerId}<br>
                            Balance: ${data.balance}<br>
                            Token expires in: ${data.expiresIn}<br><br>
                            <strong>Sportsbook URL:</strong><br>
                            ${data.sportsbookUrl}<br><br>
                            <a href="${data.sportsbookUrl}" target="_blank" class="link-button">🎰 Open Sportsbook</a>
                        </div>
                    `;
                } else {
                    showResult('flowResult', data, 'error');
                }
            } catch (error) {
                showResult('flowResult', { error: error.message }, 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Login to Sportsbook';
            }
        });

        // Check User
        document.getElementById('checkUserForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('checkBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Checking...';

            try {
                const response = await fetch('/api/check-user', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('check_username').value
                    })
                });

                const data = await response.json();
                showResult('checkResult', data, data.success ? 'success' : 'info');
            } catch (error) {
                showResult('checkResult', { error: error.message }, 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Check User';
            }
        });

        // Create User
        document.getElementById('createUserForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('createBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Creating...';

            try {
                const response = await fetch('/api/create-user', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('create_username').value,
                        email: document.getElementById('create_email').value
                    })
                });

                const data = await response.json();
                showResult('createResult', data, data.success ? 'success' : 'error');
            } catch (error) {
                showResult('createResult', { error: error.message }, 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Create User';
            }
        });

        // Generate Token
        document.getElementById('tokenForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('tokenBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Generating...';

            try {
                const response = await fetch('/api/generate-token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        customerId: document.getElementById('token_customerId').value
                    })
                });

                const data = await response.json();

                if (data.success) {
                    document.getElementById('tokenResult').innerHTML = `
                        <div class="result success">
                            <strong>✓ Token Generated!</strong><br><br>
                            Token: ${data.token.substring(0, 50)}...<br>
                            Expires in: ${data.expiresIn}<br><br>
                            <strong>Sportsbook URL:</strong><br>
                            ${data.sportsbookUrl}<br><br>
                            <a href="${data.sportsbookUrl}" target="_blank" class="link-button">🎰 Open Sportsbook</a>
                        </div>
                    `;
                } else {
                    showResult('tokenResult', data, 'error');
                }
            } catch (error) {
                showResult('tokenResult', { error: error.message }, 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Generate Token';
            }
        });
    </script>
</body>
</html>
